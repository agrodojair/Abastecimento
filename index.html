<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Conferência</title>
  <style>
    :root {
      --primary: #2f6f4f;
      --primary-dark: #245a40;
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #222;
      --muted: #777;
      --border: #d8d8d4;
      --danger: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 16px 90px;
    }
    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 20px; margin: 0; }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    h2, h3 { margin: 0 0 12px; font-size: 17px; }
    h3 { font-size: 15px; }
    input[type="text"], input[type="email"], input[type="password"], select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
      min-width: 0;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    #searchInput { width: 100%; margin-bottom: 14px; }
    button {
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover { background: var(--primary-dark); }
    button.sec { background: #fff; color: var(--text); border: 1px solid var(--border); }
    button.sec:hover { background: #efefec; }
    button.danger { background: #fff; color: var(--danger); border: 1px solid var(--border); }
    button.danger:hover { background: #fbeeed; }
    button.small { padding: 5px 10px; font-size: 13px; }
    .results-list { display: flex; flex-direction: column; gap: 8px; }
    .product-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .product-item h4 { margin: 0; font-size: 15px; font-weight: 600; }
    .product-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .product-actions select { padding: 8px; font-size: 14px; }
    @media (max-width: 520px) {
      .product-item { flex-direction: column; align-items: stretch; }
      .product-actions { justify-content: flex-end; }
    }
    .selected-list { list-style: none; padding: 0; margin: 0; }
    .selected-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }
    .empty { color: var(--muted); margin: 0; }
    .list-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .list-buttons button { width: 100%; }
    .btn-floating {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      z-index: 1000;
    }
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #222;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, transform .25s, visibility .25s;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* Admin */
    #admin { max-width: 1000px; margin: 16px auto 0; display: none; }
    #admin.show { display: block; }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    .row input { flex: 1; }
    .admin-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .admin-item:last-child { border-bottom: none; }
    .admin-item span.nm { flex: 1; word-break: break-word; }
    .admin-item .btns { display: flex; gap: 6px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

    dialog { border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: min(340px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    dialog form { display: flex; flex-direction: column; gap: 10px; }
    dialog input { width: 100%; }
    .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <header>
    <h1>Conferência</h1>
    <div>
      <button id="btnLogin" class="sec" onclick="abrirLogin()">Entrar</button>
      <button id="btnLogout" class="sec" onclick="sair()" style="display:none">Sair</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Rações Granel</h2>
      <input type="text" id="searchInput" placeholder="Digite para buscar a ração..." onkeyup="buscarNoCatalogo()">
      <div id="results" class="results-list"></div>
    </div>

    <div class="card" id="listSection">
      <h3>Rações Abastecidas</h3>
      <ul id="selectedList" class="selected-list"></ul>
      <div class="list-buttons">
        <button onclick="copiarLista()">Copiar lista</button>
        <button class="sec" onclick="limparLista()">Limpar lista</button>
      </div>
    </div>
  </div>

  <!-- Área do administrador -->
  <div id="admin">
    <div class="card">
      <h2>Administração</h2>
      <p class="hint">Importe um arquivo JSON com as rações (campo "racoes") e tamanhos (campo "pesos"). Itens já cadastrados são ignorados.</p>
      <input type="file" id="fileImport" accept=".json,application/json" style="display:none" onchange="importarJSON(this)">
      <button class="sec" onclick="document.getElementById('fileImport').click()">Importar JSON</button>
    </div>
    <div class="admin-grid">
      <div class="card">
        <h3>Rações</h3>
        <div class="row">
          <input type="text" id="novaRacao" placeholder="Nome da ração">
          <button onclick="adicionarRacao()">Adicionar</button>
        </div>
        <input type="text" id="filtroAdmin" placeholder="Filtrar" style="width:100%;margin-bottom:10px" onkeyup="renderAdminRacoes()">
        <div id="adminRacoes" class="admin-list"></div>
      </div>
      <div class="card">
        <h3>Tamanhos</h3>
        <div class="row">
          <input type="text" id="novoPeso" placeholder="Ex.: 30Kg">
          <button onclick="adicionarPeso()">Adicionar</button>
        </div>
        <div id="adminPesos" class="admin-list"></div>
      </div>
    </div>
  </div>

  <button class="btn-floating" onclick="rolarParaOFim()">Finalizar</button>

  <dialog id="dlgLogin">
    <form onsubmit="entrar(event)">
      <h3>Entrar</h3>
      <input type="email" id="loginEmail" placeholder="E-mail" required autocomplete="username">
      <input type="password" id="loginSenha" placeholder="Senha" required autocomplete="current-password">
      <div class="dlg-btns">
        <button type="button" class="sec" onclick="document.getElementById('dlgLogin').close()">Cancelar</button>
        <button type="submit">Entrar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import {
      getFirestore, doc, collection, onSnapshot, runTransaction,
      addDoc, updateDoc, deleteDoc, setDoc, writeBatch
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCK_ukB0OCgH2kbWCbGj2LDarWHFFVH3I8",
      authDomain: "abastecimento-c296e.firebaseapp.com",
      projectId: "abastecimento-c296e",
      storageBucket: "abastecimento-c296e.firebasestorage.app",
      messagingSenderId: "339888568302",
      appId: "1:339888568302:web:409cad60b94df0c4b6c0ff"
    };

    const ADMIN_UID = "fmLqk1OiGLXMnhTpHcCrVy4kjGX2";
    const SENHA_LIMPAR = "1274";

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    const listaRef = doc(db, "abastecimento", "atual");
    const racoesCol = collection(db, "racoes");
    const pesosRef = doc(db, "config", "pesos");

    let usuarioAutenticado = false;
    let sincronizacaoIniciada = false;
    let isAdmin = false;
    let catalogoProdutos = [];   // [{id, nome}]
    let pesos = [];              // ["5Kg", ...]
    let minhaLista = [];
    let toastTimeout;

    const collator = new Intl.Collator("pt-BR", { sensitivity: "base", numeric: true });
    const porNome = (a, b) => collator.compare(a.nome, b.nome);
    const porPeso = (a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0);
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (s) => String(s).toLowerCase().replace(/\s+/g, " ").trim();

    // ---------- Utilidades ----------
    function mostrarPopup(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove("show"), 1800);
    }

    function rolarParaOFim() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    // ---------- Lista de abastecimento ----------
    async function alterarListaFirebase(alteracao) {
      if (!usuarioAutenticado) {
        alert("Ainda estamos conectando ao servidor. Aguarde um instante e tente novamente.");
        return false;
      }
      try {
        await runTransaction(db, async (transaction) => {
          const snapshot = await transaction.get(listaRef);
          const dados = snapshot.exists() ? snapshot.data() : {};
          const atual = Array.isArray(dados.itens) ? dados.itens : [];
          transaction.set(listaRef, { itens: alteracao(atual), atualizadoEm: new Date().toISOString() });
        });
        return true;
      } catch (erro) {
        console.error("Erro ao salvar a lista:", erro);
        alert("Não foi possível salvar a lista no servidor. Verifique sua conexão e tente novamente.");
        return false;
      }
    }

    async function limparLista() {
      if (minhaLista.length === 0) return;
      const senha = prompt("Digite a senha para limpar a lista:");
      if (senha === null) return;
      if (senha !== SENHA_LIMPAR) {
        alert("Senha incorreta.");
        return;
      }
      await alterarListaFirebase(() => []);
    }

    function listaOrdenada() {
      return [...minhaLista].sort((a, b) => porNome(a, b) || porPeso(a.peso, b.peso));
    }

    function atualizarListaVisual() {
      const ul = document.getElementById("selectedList");
      ul.innerHTML = "";
      if (minhaLista.length === 0) {
        ul.innerHTML = '<p class="empty">Nenhum item adicionado.</p>';
        return;
      }
      listaOrdenada().forEach(item => {
        const li = document.createElement("li");
        li.className = "selected-item";
        li.innerHTML = `
          <span><strong>${item.qtd}x</strong> ${esc(item.nome)} <strong>(${esc(item.peso)})</strong></span>
          <button class="danger small" onclick="removerItem('${esc(item.unicoId)}')">Remover</button>
        `;
        ul.appendChild(li);
      });
    }

    async function removerItem(unicoId) {
      await alterarListaFirebase(l => l.filter(i => i.unicoId !== unicoId));
    }

    async function copiarLista() {
      if (minhaLista.length === 0) {
        alert("Adicione pelo menos um item à lista!");
        return;
      }
      let texto = "*Rações Abastecidas:*\n\n";
      listaOrdenada().forEach(i => { texto += `• *${i.qtd}x* ${i.nome} - *${i.peso}*\n\n`; });
      texto = texto.trimEnd();
      try {
        await navigator.clipboard.writeText(texto);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = texto;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      mostrarPopup("Lista copiada");
    }

    // ---------- Catálogo ----------
    // Busca por palavras parciais: "qua cast salm" encontra "Quartz Castrados Salmao"
    function filtrarCatalogo(texto) {
      const termo = norm(texto);
      if (!termo) return catalogoProdutos;
      const palavras = termo.split(" ");
      return catalogoProdutos.filter(p => palavras.every(w => norm(p.nome).includes(w)));
    }

    function buscarNoCatalogo() {
      exibirProdutos(filtrarCatalogo(document.getElementById("searchInput").value));
    }

    function exibirProdutos(produtos) {
      const div = document.getElementById("results");
      div.innerHTML = "";
      if (produtos.length === 0) {
        div.innerHTML = `<p class="empty">${catalogoProdutos.length ? "Nenhum item encontrado." : "Nenhuma ração cadastrada."}</p>`;
        return;
      }
      const opcoesPeso = pesos.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
      const opcoesQtd = Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}">${i + 1}x</option>`).join("");
      produtos.forEach(p => {
        const el = document.createElement("div");
        el.className = "product-item";
        el.innerHTML = `
          <h4>${esc(p.nome)}</h4>
          <div class="product-actions">
            <select id="qty-${p.id}">${opcoesQtd}</select>
            <select id="weight-${p.id}"><option value="" disabled selected>Peso</option>${opcoesPeso}</select>
            <button onclick="adicionarItem('${p.id}')">+</button>
          </div>`;
        div.appendChild(el);
      });
    }

    async function adicionarItem(id) {
      const item = catalogoProdutos.find(p => p.id === id);
      const pesoSel = document.getElementById(`weight-${id}`);
      const qtySel = document.getElementById(`qty-${id}`);
      const peso = pesoSel ? pesoSel.value : "";
      const qtd = qtySel ? parseInt(qtySel.value, 10) : 1;

      if (!peso) { alert("Por favor, selecione o peso antes de adicionar a ração!"); return; }
      if (!item) return;

      const unicoId = `${id}-${peso}`;
      const ok = await alterarListaFirebase((atual) => {
        const nova = [...atual];
        const existente = nova.find(i => i.unicoId === unicoId);
        if (existente) existente.qtd += qtd;
        else nova.push({ id, nome: item.nome, unicoId, peso, qtd });
        return nova;
      });
      if (!ok) return;

      mostrarPopup(`${qtd}x ${item.nome} (${peso}) adicionada`);
      document.getElementById("searchInput").value = "";
      buscarNoCatalogo();
    }

    // ---------- Administração ----------
    function renderAdminRacoes() {
      const div = document.getElementById("adminRacoes");
      const lista = filtrarCatalogo(document.getElementById("filtroAdmin").value);
      div.innerHTML = lista.length ? "" : '<div class="admin-item"><span class="empty">Nenhuma ração.</span></div>';
      lista.forEach(r => {
        const el = document.createElement("div");
        el.className = "admin-item";
        el.innerHTML = `<span class="nm">${esc(r.nome)}</span>
          <span class="btns">
            <button class="sec small" onclick="editarRacao('${r.id}')">Editar</button>
            <button class="danger small" onclick="removerRacao('${r.id}')">Excluir</button>
          </span>`;
        div.appendChild(el);
      });
    }

    function renderAdminPesos() {
      const div = document.getElementById("adminPesos");
      div.innerHTML = pesos.length ? "" : '<div class="admin-item"><span class="empty">Nenhum tamanho.</span></div>';
      pesos.forEach((p, i) => {
        const el = document.createElement("div");
        el.className = "admin-item";
        el.innerHTML = `<span class="nm">${esc(p)}</span>
          <span class="btns">
            <button class="sec small" onclick="editarPeso(${i})">Editar</button>
            <button class="danger small" onclick="removerPeso(${i})">Excluir</button>
          </span>`;
        div.appendChild(el);
      });
    }

    async function tentar(fn, msg) {
      try { await fn(); return true; }
      catch (e) { console.error(e); alert(msg || "Não foi possível salvar. Verifique sua conexão e permissões."); return false; }
    }

    async function adicionarRacao() {
      const input = document.getElementById("novaRacao");
      const nome = input.value.replace(/\s+/g, " ").trim();
      if (!nome) return;
      if (catalogoProdutos.some(r => norm(r.nome) === norm(nome))) { alert("Essa ração já está cadastrada."); return; }
      if (await tentar(() => addDoc(racoesCol, { nome }))) { input.value = ""; mostrarPopup("Ração adicionada"); }
    }

    async function editarRacao(id) {
      const r = catalogoProdutos.find(x => x.id === id);
      if (!r) return;
      const nome = prompt("Editar nome da ração:", r.nome);
      if (nome === null) return;
      const novo = nome.replace(/\s+/g, " ").trim();
      if (!novo || novo === r.nome) return;
      if (await tentar(() => updateDoc(doc(db, "racoes", id), { nome: novo }))) mostrarPopup("Ração atualizada");
    }

    async function removerRacao(id) {
      const r = catalogoProdutos.find(x => x.id === id);
      if (!r || !confirm(`Excluir "${r.nome}"?`)) return;
      if (await tentar(() => deleteDoc(doc(db, "racoes", id)))) mostrarPopup("Ração excluída");
    }

    const salvarPesos = (lista) => setDoc(pesosRef, { lista: [...new Set(lista)].sort(porPeso) });

    async function adicionarPeso() {
      const input = document.getElementById("novoPeso");
      const p = input.value.replace(/\s+/g, "").trim();
      if (!p) return;
      if (pesos.some(x => norm(x) === norm(p))) { alert("Esse tamanho já existe."); return; }
      if (await tentar(() => salvarPesos([...pesos, p]))) input.value = "";
    }

    async function editarPeso(i) {
      const novo = prompt("Editar tamanho:", pesos[i]);
      if (novo === null) return;
      const p = novo.replace(/\s+/g, "").trim();
      if (!p || p === pesos[i]) return;
      const nova = [...pesos]; nova[i] = p;
      await tentar(() => salvarPesos(nova));
    }

    async function removerPeso(i) {
      if (!confirm(`Excluir o tamanho "${pesos[i]}"?`)) return;
      await tentar(() => salvarPesos(pesos.filter((_, k) => k !== i)));
    }

    async function importarJSON(input) {
      const arquivo = input.files[0];
      input.value = "";
      if (!arquivo) return;
      try {
        const dados = JSON.parse(await arquivo.text());
        const existentes = new Set(catalogoProdutos.map(r => norm(r.nome)));
        let batch = writeBatch(db), ops = 0, novas = 0;
        for (const r of (dados.racoes || [])) {
          const nome = String(r.nome || "").replace(/\s+/g, " ").trim();
          if (!nome || existentes.has(norm(nome))) continue;
          existentes.add(norm(nome));
          batch.set(doc(racoesCol), { nome });
          novas++;
          if (++ops === 400) { await batch.commit(); batch = writeBatch(db); ops = 0; }
        }
        if (ops) await batch.commit();
        if (Array.isArray(dados.pesos) && dados.pesos.length) {
          await salvarPesos([...pesos, ...dados.pesos.map(p => String(p).replace(/\s+/g, ""))]);
        }
        mostrarPopup(`${novas} ração(ões) importada(s)`);
      } catch (e) {
        console.error(e);
        alert("Falha na importação. Verifique o arquivo JSON e as permissões.");
      }
    }

    // ---------- Login ----------
    function abrirLogin() { document.getElementById("dlgLogin").showModal(); }

    async function entrar(ev) {
      ev.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const senha = document.getElementById("loginSenha").value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        if (cred.user.uid !== ADMIN_UID) {
          await signOut(auth);
          alert("Esta conta não tem acesso à administração.");
          return;
        }
        document.getElementById("loginSenha").value = "";
        document.getElementById("dlgLogin").close();
      } catch (e) {
        console.error(e);
        alert("E-mail ou senha incorretos.");
      }
    }

    async function sair() { await signOut(auth); location.reload(); }

    function aplicarEstadoAdmin() {
      document.getElementById("admin").classList.toggle("show", isAdmin);
      document.getElementById("btnLogin").style.display = isAdmin ? "none" : "";
      document.getElementById("btnLogout").style.display = isAdmin ? "" : "none";
    }

    // ---------- Globais para os onclick ----------
    Object.assign(window, {
      buscarNoCatalogo, adicionarItem, removerItem, limparLista, copiarLista, rolarParaOFim,
      renderAdminRacoes, adicionarRacao, editarRacao, removerRacao,
      adicionarPeso, editarPeso, removerPeso, importarJSON, abrirLogin, entrar, sair
    });

    atualizarListaVisual();
    exibirProdutos(catalogoProdutos);

    // ---------- Autenticação e sincronização ----------
    onAuthStateChanged(auth, (usuario) => {
      usuarioAutenticado = !!usuario;
      isAdmin = !!usuario && usuario.uid === ADMIN_UID;
      aplicarEstadoAdmin();

      if (!usuario) {
        signInAnonymously(auth).catch((erro) => {
          console.error("Erro ao autenticar anonimamente:", erro);
          alert("Não foi possível conectar ao servidor. Recarregue a página e tente novamente.");
        });
        return;
      }
      if (sincronizacaoIniciada) return;
      sincronizacaoIniciada = true;

      onSnapshot(listaRef, (snap) => {
        const d = snap.exists() ? snap.data() : {};
        minhaLista = Array.isArray(d.itens) ? d.itens : [];
        atualizarListaVisual();
      }, (e) => {
        console.error("Erro ao sincronizar a lista:", e);
        document.getElementById("selectedList").innerHTML = '<p class="empty">Não foi possível carregar a lista (' + esc(e.code || "erro") + ').</p>';
      });

      onSnapshot(racoesCol, (snap) => {
        catalogoProdutos = snap.docs.map(d => ({ id: d.id, nome: d.data().nome || "" })).sort(porNome);
        buscarNoCatalogo();
        renderAdminRacoes();
      }, (e) => {
        console.error("Erro ao sincronizar as rações:", e);
        document.getElementById("results").innerHTML = '<p class="empty">Não foi possível carregar as rações (' + esc(e.code || "erro") + '). Verifique se as regras do Firestore foram publicadas.</p>';
      });

      onSnapshot(pesosRef, (snap) => {
        const l = snap.exists() ? snap.data().lista : [];
        pesos = (Array.isArray(l) ? l : []).sort(porPeso);
        buscarNoCatalogo();
        renderAdminPesos();
      }, (e) => console.error("Erro ao sincronizar os tamanhos:", e));
    });
  </script>
</body>
</html>
